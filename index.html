<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nha Khoa Hoàng Bách - Gò Quao — Quản lý phòng khám</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#0E7E6B">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#17211E">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="NK Hoàng Bách - Gò Quao">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">

</head>
<!-- spellcheck=false: bo kiem chinh ta cua trinh duyet. No khong biet tieng Viet nen
     gach do gan het chu, vua roi mat vua che dau nhac loi that. Dat o body thi moi o
     nhap ben trong deu thua theo. autocapitalize/autocorrect tat luon cho iPhone khoi
     tu sua chu va tu viet hoa. -->
<body spellcheck="false" autocapitalize="off" autocorrect="off">

<div class="app">
  <header class="topbar">
    <div class="logo">
      <div class="logo-mark">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5.5C10.5 4 8.5 3 7 3 4.5 3 3 5 3 7.5c0 4.5 2.5 6 3 9 .4 2.4.8 4.5 2.2 4.5 1.6 0 1.2-3.5 2.3-5.5.5-1 2.5-1 3 0 1.1 2 .7 5.5 2.3 5.5 1.4 0 1.8-2.1 2.2-4.5.5-3 3-4.5 3-9C21 5 19.5 3 17 3c-1.5 0-3.5 1-5 2.5Z"/></svg>
      </div>
      <div><b>Nha Khoa Hoàng Bách - Gò Quao</b><small>Số 33 đường 3/2, Xã Gò Quao, An Giang</small></div>
    </div>
    <div class="topbar-right">
      <button class="icon-btn" onclick="App.backup()" title="Sao lưu dữ liệu ra file" aria-label="Sao lưu">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12m0 0 4-4m-4 4-4-4"/><path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg>
      </button>
      <button class="icon-btn" onclick="App.restorePick()" title="Phục hồi dữ liệu từ file" aria-label="Phục hồi">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21V9m0 0-4 4m4-4 4 4"/><path d="M4 7V5a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v2"/></svg>
      </button>
      <button class="icon-btn" id="syncBtn" onclick="App.syncNow()" title="Đồng bộ dữ liệu" aria-label="Đồng bộ">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 0 1-9 9 9 9 0 0 1-7.5-4M3 12a9 9 0 0 1 9-9 9 9 0 0 1 7.5 4"/><path d="M20 4v5h-5M4 20v-5h5"/></svg>
        <span class="dot" id="syncDot" style="display:none"></span>
      </button>
      <button class="avatar" id="meBtn" onclick="App.accountMenu()" title="Tài khoản" aria-label="Tài khoản">TV</button>
    </div>
    <input type="file" id="restoreFile" accept="application/json" style="display:none">
  </header>

  <nav class="sidebar" aria-label="Điều hướng chính" id="sideNav"></nav>

  <main class="main" id="mainArea"></main>
</div>

<nav class="bottom-nav" id="bottomNav" aria-label="Điều hướng"></nav>
<div class="sheet-back" id="sheetBack" onclick="App.closeSheet()"></div>
<div class="sheet" id="moreSheet"></div>

<div class="modal-back" id="modalBack">
  <div class="modal-box" role="dialog" aria-modal="true">
    <div class="modal-h"><h2 id="modalTitle"></h2>
      <button class="icon-btn" onclick="App.closeModal()" aria-label="Đóng">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <div class="modal-b" id="modalBody"></div>
  </div>
</div>

<div id="printArea"></div>
<div id="toast"></div>

<script src="qrcode.lib.js"></script>
<script src="qr.js?v=75"></script>
<script src="config.js?v=75"></script>
<script src="cloud.js?v=75"></script>
<script src="wards.js?v=75"></script>
<script src="vatlieu.js?v=75"></script>
<script src="banggia.js?v=75"></script>
<script src="sync.js?v=75"></script>
<script src="importer.js?v=75"></script>
<script src="app.js?v=75"></script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js'));
}
</script>
</body>
</html>
